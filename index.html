<!doctype html><html lang="pt-BR" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MemoQuiz</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#EDEBFF;--tx:#1B1740;--sub:#3A3668;--card:#fff;--line:#C9C5F5;--soft:#D9D5FF;--ink:#2E24A8;--hero:#3B2FD9;--err:#B91C1C;--ok:#15803D;--gl:rgba(255,255,255,.82);--gb:rgba(255,255,255,.9);--sh:rgba(55,48,163,.22);color-scheme:light}
:root[data-theme=dark]{--bg:#0A0820;--tx:#F1F0FF;--sub:#B3AFDA;--card:#17133A;--line:#3A3478;--soft:#352E8C;--ink:#D4D0FF;--hero:#4A3CF0;--err:#FF8A8A;--ok:#4ADE80;--gl:rgba(28,23,70,.85);--gb:rgba(255,255,255,.16);--sh:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid #F5B83D;outline-offset:2px}
main{max-width:820px;padding:calc(20px + env(safe-area-inset-top)) 20px 110px}h1{margin:0;font-size:clamp(24px,5vw,28px);font-weight:800;overflow-wrap:anywhere}h2{margin:24px 0 10px;font-size:20px}
.sub{color:var(--sub)}.sb{justify-content:space-between}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.btn,.btn2{min-height:48px;border-radius:14px;padding:0 20px;font-weight:800;border:2px solid transparent}.btn{background:#F5B83D;color:#1B1740}.btn2{background:transparent;border-color:var(--ink);color:var(--ink)}
.big{min-height:56px;font-size:17px}button:disabled{opacity:.4;cursor:not-allowed}.g1{background:var(--ok);color:#fff;border-color:var(--ok)}.r1{background:var(--card);color:var(--err);border-color:var(--err)}.fl{flex:1}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.hero .sub{color:#E0DEFF}.hero h3{margin:2px 0;font-size:28px;font-weight:800;overflow-wrap:anywhere}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}.bar.p i{background:var(--hero)}.tb i{background:#F5B83D;width:100%;transition:width linear}
.tag{display:inline-block;padding:4px 12px;border-radius:20px;background:var(--soft);color:var(--ink);font-size:13px;font-weight:700}
.q{font-size:24px;font-weight:700;line-height:1.35;margin:12px 0}.an{padding:14px;border-radius:12px;background:var(--soft);margin-top:8px}
.seg{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--line);flex-wrap:wrap;margin-top:8px}.seg button{flex:1;min-height:44px;border:0;border-radius:10px;font-weight:700;background:transparent;padding:0 10px}.seg [aria-pressed=true]{background:var(--hero);color:#fff}
.inp{width:100%;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:10px 14px}textarea.inp{min-height:90px;resize:vertical}
label,.lb{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
.sw{width:56px;height:32px;border-radius:16px;border:0;padding:3px;background:var(--line);display:flex;flex:none}.sw[aria-checked=true]{background:var(--ok);justify-content:flex-end}.sw i{width:26px;height:26px;border-radius:50%;background:#fff}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);text-align:left;font-weight:700}.opt.g{border-color:var(--ok);background:var(--soft)}.opt.r{border-color:var(--err);background:var(--soft)}
.ltr{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--ink);display:grid;place-items:center;font-weight:800;flex:none}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stats b{font-size:28px;display:block}
.dk{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.dk .g{flex:1 1 200px;min-width:0}.dk .bt{display:flex;gap:8px}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:20;font-weight:700}[hidden]{display:none!important}
nav{position:fixed;z-index:9;display:flex;background:var(--gl);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--gb);box-shadow:0 12px 40px var(--sh)}
.nb{display:flex;align-items:center;gap:12px;height:48px;padding:0 13px;border:0;border-radius:16px;background:transparent;color:var(--sub);font-weight:600;white-space:nowrap}.nb[aria-current=page]{background:var(--soft);color:var(--ink);font-weight:800}
.lg{width:36px;height:36px;margin:6px 4px;border-radius:10px;background:#3B2FD9;color:#fff;font-weight:800;display:grid;place-items:center;flex:none}.sp{flex:1}
.pl{display:flex;align-items:center;justify-content:center}.mh{display:none}.chev{flex:none;color:var(--sub);margin-right:14px}.ib{width:44px;height:44px;flex:none;border-radius:14px;padding:0;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.cd{display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:left;min-height:260px;justify-content:center;width:100%;color:var(--tx)}.cd .an{width:100%}.q,.an,.opt,.card{overflow-wrap:anywhere}
@media(max-width:719px){nav{left:0;right:0;bottom:0;height:calc(80px + env(safe-area-inset-bottom));padding:8px 8px calc(14px + env(safe-area-inset-bottom));background:var(--card);border:0;border-top:1px solid var(--line);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}.nb{flex:1;flex-direction:column;justify-content:center;gap:4px;height:auto;padding:0;font-size:12px;border-radius:0;background:transparent!important}.nb .pl{width:60px;height:32px;border-radius:16px}.nb[aria-current=page] .pl{background:var(--soft)}.lg,.sp,.dsk{display:none!important}.mh{display:flex;align-items:center;gap:10px;margin-bottom:16px}.hero .btn{width:100%}.q{font-size:22px}.xl{display:none}.dk .bt{width:100%}.dk .bt .btn,.dk .bt .btn2{flex:1}}
@media(min-width:720px){nav{left:16px;top:16px;bottom:16px;width:76px;flex-direction:column;border-radius:28px;padding:12px;gap:6px;overflow:hidden;transition:width .25s}nav:hover,nav:focus-within{width:248px}nav .nl{opacity:0;transition:opacity .2s}nav:hover .nl,nav:focus-within .nl{opacity:1}main{margin-left:max(108px,calc(50vw - 356px));padding:32px 24px 60px}#ts{bottom:30px}}
</style></head><body><nav aria-label="Principal" id="nv"></nav><main id="m"></main><div id="ts" role="status" hidden></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const KEY='memoquiz.v1',iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>iso(new Date()),fmt=s=>s.split('-').reverse().join('/');
const C=(t,q,a,w)=>t=='v'?{id:uid(),t,q,truth:a,why:w,err:0,ok:0,lvl:0}:{id:uid(),t,q,a,err:0,ok:0,lvl:0};
const seed=()=>({theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light',timer:0,sess:10,hard:true,last:null,hist:[],days:[],decks:[{id:uid(),name:'Conjuntos',subj:'Matemática',cards:[C('i','O que é o conjunto vazio?','É o conjunto sem elementos, escrito ∅ ou { }.'),C('v','O conjunto vazio é subconjunto de qualquer conjunto.',true,'O vazio não tem elemento que fique de fora de outro conjunto.'),C('v','{1, 2} e {2, 1} são conjuntos diferentes.',false,'A ordem dos elementos não importa em um conjunto.'),C('i','Como se escreve "x pertence ao conjunto A"?','x ∈ A'),C('i','O que é a união de A e B?','O conjunto dos elementos que estão em A ou em B.')]},{id:uid(),name:'Python básico',subj:'Programação',cards:[C('i','Qual função mostra texto na tela?','print()'),C('v','Em Python, a lista começa no índice 1.',false,'O primeiro índice é 0.'),C('i','Qual palavra cria uma função?','def'),C('i','Qual tipo guarda verdadeiro ou falso?','bool')]}]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.decks)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const T={view:'home',deck:null,f:null,st:null,sm:null,cf:null},blank=()=>({t:'i',q:'',a:'',truth:true,why:''});
const deck=id=>S.decks.find(d=>d.id==id),pct=d=>d.cards.length?Math.round(d.cards.filter(c=>c.lvl>=3).length/d.cards.length*100):0,pt=n=>n.toFixed(1).replace('.',',');
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const markDay=()=>{if(!S.days.includes(today()))S.days.push(today())};
const streak=()=>{const set=new Set(S.days),d=new Date();let n=0;if(!set.has(iso(d)))d.setDate(d.getDate()-1);while(set.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n};
const toast=m=>{const t=$('#ts');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2500)};
const cf=(k,fn)=>{if(T.cf!=k){T.cf=k;render();setTimeout(()=>{if(T.cf==k){T.cf=null;render()}},3000);return}T.cf=null;fn();render()};
const seg=(k,cur,o)=>`<div class="seg" role="group">${o.map(([v,l])=>`<button data-a="set" data-k="${k}" data-v="${v}" aria-pressed="${cur==v}">${l}</button>`).join('')}</div>`;
const ic=d=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const NAV=[['home','Baralhos','M12 3l9 5-9 5-9-5 9-5z M3 13l9 5 9-5'],['study','Estudar','M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2V5z M8 7h6'],['sim','Simulado','M9 4h6v3H9z M7 5H5v16h14V5h-2 M9 14l2 2 4-4'],['prog','Progresso','M4 20V10 M10 20V4 M16 20v-7 M21 20H3']];const GEAR='M4 6h10 M18 6h2 M4 12h4 M12 12h8 M4 18h12 M14 4v4 M10 10v4 M16 16v4';
const pickList=(act,lbl)=>S.decks.length?`<div class="col" style="margin-top:16px">${S.decks.map(d=>`<div class="card dk"><div class="g"><span class="tag">${esc(d.subj||'Sem matéria')}</span><div style="font-weight:800;font-size:18px">${esc(d.name)}</div><small class="sub">${d.cards.length} cartas</small></div><button class="btn" data-a="${act}" data-id="${d.id}">${lbl}</button></div>`).join('')}</div>`:'<p class="sub">Crie um baralho primeiro.</p>';
const V={};
const CHV='<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
V.home=()=>{if(T.deck)return ed();const d=deck(S.last)||S.decks[0],tot=S.decks.reduce((a,x)=>a+x.cards.length,0);
return `<div class="col" style="gap:20px"><div><h1>Olá!</h1><p class="sub" style="margin:6px 0 0">${tot?tot+' cartas esperam por você.':'Crie seu primeiro baralho.'}</p></div>`+(d?`<section class="hero"><div><div class="sub" style="font-size:13px;font-weight:700">Continuar estudando</div><h3>${esc(d.name)}</h3><div class="sub">${d.cards.length} cartas · ${pct(d)}% dominado</div></div>${d.cards.length?`<button class="btn big" data-a="study" data-id="${d.id}">Estudar agora</button>`:`<button class="btn big" data-a="edit" data-id="${d.id}">Adicionar cartas</button>`}</section>`:'')+`<div class="row sb"><h2 style="margin:0">Meus baralhos</h2><button class="btn2" data-a="newdeck">+ Novo<span class="xl"> baralho</span></button></div>${S.decks.map(d=>`<div class="card dk" style="padding:0;flex-wrap:nowrap;gap:0"><button data-a="study" data-id="${d.id}" style="flex:1;display:flex;align-items:center;gap:12px;min-width:0;border:0;background:transparent;text-align:left;padding:14px 8px 14px 18px;min-height:72px"><span style="display:block;flex:1;min-width:0"><span style="display:block;font-size:12px;font-weight:700;color:var(--ink)">${esc(d.subj||'Sem matéria')}</span><span style="display:block;font-size:18px;font-weight:800;overflow-wrap:anywhere">${esc(d.name)}</span><span class="bar" style="display:block;height:6px;margin-top:8px"><i style="width:${pct(d)}%"></i></span></span><span class="sub" style="font-size:13px;font-weight:700;white-space:nowrap">${d.cards.length} cartas</span></button><button class="ib" data-a="edit" data-id="${d.id}" aria-label="Editar ${esc(d.name)}" style="margin-right:8px">${ic('M4 20h4L19 9l-4-4L4 16z')}</button>${CHV}</div>`).join('')}</div>`};
function ed(){const d=deck(T.deck);if(!d){T.deck=null;return V.home()}const f=T.f||(T.f=blank()),sg=(a,cur,o)=>`<div class="seg" role="group">${o.map(([v,l])=>`<button data-a="${a}" data-v="${v}" aria-pressed="${cur==v}">${l}</button>`).join('')}</div>`;
return `<button class="btn2" data-a="nav" data-v="home">← Baralhos</button><h1 style="margin:16px 0 4px">Editar baralho</h1><label for="dn">Nome do baralho</label><input id="dn" class="inp" data-d="name" value="${esc(d.name)}"><label for="ds">Matéria</label><input id="ds" class="inp" data-d="subj" value="${esc(d.subj)}"><h2>Cartas (${d.cards.length})</h2><div class="col">${d.cards.map(c=>`<div class="card dk"><div class="g"><span class="tag">${c.t=='v'?'Verdadeiro ou falso':'Informação'}</span><div style="font-weight:700;margin:6px 0">${esc(c.q)}</div><small class="sub">${c.t=='v'?(c.truth?'Verdadeiro':'Falso')+(c.why?' · '+esc(c.why):''):esc(c.a)}</small></div><div class="bt"><button class="btn2" data-a="ecard" data-id="${c.id}">Editar</button><button class="btn2" data-a="dcard" data-id="${c.id}">${T.cf=='c'+c.id?'Confirmar?':'Excluir'}</button></div></div>`).join('')||'<p class="sub">Nenhuma carta ainda.</p>'}</div>
<div class="card" id="fm" style="margin-top:16px"><b>${f.id?'Editar carta':'Nova carta'}</b>${sg('ft',f.t,[['i','Informação'],['v','Verdadeiro ou falso']])}<label for="fq">${f.t=='v'?'Afirmação':'Pergunta'}</label><textarea id="fq" class="inp" data-f="q">${esc(f.q)}</textarea>${f.t=='v'?`<div class="lb">Esta afirmação é</div>${sg('ftr',f.truth?1:0,[[1,'Verdadeira'],[0,'Falsa']])}<label for="fw">Motivo (aparece ao errar)</label><textarea id="fw" class="inp" data-f="why">${esc(f.why)}</textarea>`:`<label for="fa">Resposta</label><textarea id="fa" class="inp" data-f="a">${esc(f.a)}</textarea>`}<div class="row" style="margin-top:14px"><button class="btn big" data-a="fsave">Salvar carta</button>${f.id?'<button class="btn2" data-a="fcancel">Cancelar edição</button>':''}</div></div>
<button class="btn2" data-a="ddeck" style="margin-top:28px;border-color:var(--err);color:var(--err)">${T.cf=='d'?'Toque de novo para excluir o baralho':'Excluir baralho'}</button>`}
const cardOf=s=>deck(s.d)?.cards.find(x=>x.id==s.q[s.i]);
V.study=()=>{const s=T.st;if(!s)return `<h1>Estudar</h1><p class="sub">Tempo por carta: ${S.timer?S.timer+' s':'desligado'} · ${S.sess} cartas por sessão. Ajuste em Configurações.</p>`+pickList('study','Estudar');
const d=deck(s.d),n=s.q.length;if(s.done)return `<div class="card col"><h1>Sessão concluída</h1><p style="font-size:18px;margin:0">Você errou ${s.errs} de ${n} cartas.</p><p class="sub" style="margin:0">As cartas que você errou voltam com mais frequência nas próximas revisões.</p><div class="row"><button class="btn big" data-a="study" data-id="${s.d}">Estudar de novo</button><button class="btn2 big" data-a="gosim" data-id="${s.d}">Fazer simulado</button><button class="btn2 big" data-a="nav" data-v="home">Baralhos</button></div></div>`;
const c=cardOf(s);if(!c){T.st=null;return V.study()}
const v=c.t=='v',fb=s.res=='ok'?'✓ Correto!':s.res=='bad'?'✗ Errado.':s.res=='time'?'⏱ Tempo esgotado.':'';
const tg=v||s.rev?'div':'button data-a="rev" aria-label="Virar a carta"',te=v||s.rev?'div':'button';
return `<div class="row sb"><h1>${esc(d.name)}</h1><span class="sub" style="font-weight:800">${s.i+1} / ${n}</span></div><div class="bar p" style="margin:12px 0"><i style="width:${s.i/n*100}%"></i></div>${S.timer&&!s.res&&!s.rev?`<div class="bar tb" aria-hidden="true"><i id="tbi"></i></div><div class="sub" id="tl" style="margin:4px 0 8px;font-size:14px">${S.timer} s</div>`:''}
<${tg} class="card cd"><span class="tag">${v?'Verdadeiro ou falso':'Informação'}</span><span class="q" style="display:block">${esc(c.q)}</span>${!v&&!s.rev?'<span class="sub" style="font-size:14px">Toque na carta para ver a resposta.</span>':''}${s.rev&&!v?`<span class="an" style="display:block"><b>Resposta:</b> ${esc(c.a)}</span>`:''}${fb?`<span class="an" role="status" style="display:block"><b>${fb}</b>${v&&s.res!='ok'?` A afirmação é ${c.truth?'verdadeira':'falsa'}.${c.why?' Motivo: '+esc(c.why):''}`:''}</span>`:''}</${te}>
<div class="row" style="margin-top:14px">${s.res?`<button class="btn big fl" data-a="nx">${s.i+1>=n?'Ver resultado':'Próxima'}</button>`:v?`<button class="btn2 big fl" data-a="vf" data-v="1">Verdadeiro</button><button class="btn2 big fl" data-a="vf" data-v="0">Falso</button>`:`<button class="btn big fl r1" data-a="ans" data-ok="0" ${s.rev?'':'disabled'}>Errei</button><button class="btn big fl g1" data-a="ans" data-ok="1" ${s.rev?'':'disabled'}>Acertei</button>`}</div><button class="btn2" style="margin-top:20px" data-a="endst">Encerrar sessão</button>`};
V.sim=()=>{const s=T.sm;if(!s)return `<h1>Simulado</h1><p class="sub">Questões de múltipla escolha geradas a partir das suas cartas (até 20).</p>`+pickList('startsim','Iniciar');const n=s.qs.length;
if(s.done)return `<div class="card col"><h1>Nota ${pt(s.nota)}</h1><p style="margin:0">Você acertou ${s.sc} de ${n} questões.</p></div>${s.wr.length?`<h2>Para revisar</h2><div class="col">${s.wr.map(q=>`<div class="card"><div style="font-weight:700">${esc(q.q)}</div><div class="an"><b>Resposta certa:</b> ${esc(q.o[q.a])}</div></div>`).join('')}</div>`:'<p>Perfeito, sem erros!</p>'}<div class="row" style="margin-top:16px"><button class="btn big" data-a="startsim" data-id="${s.id}">Refazer</button><button class="btn2 big" data-a="nav" data-v="home">Baralhos</button></div>`;
const q=s.qs[s.i],p=s.pick!=null;return `<div class="row sb"><h1>Simulado</h1><span class="sub" style="font-weight:800">Questão ${s.i+1} de ${n}</span></div><div class="bar p" style="margin:12px 0"><i style="width:${s.i/n*100}%"></i></div><div class="col"><div class="card"><div class="sub" style="font-weight:700">${esc(s.name)}</div><div class="q" style="font-size:21px">${esc(q.q)}</div></div>${q.o.map((o,i)=>`<button class="opt ${p&&i==q.a?'g':p&&i==s.pick?'r':''}" data-a="sp" data-i="${i}"><span class="ltr">${'ABCD'[i]}</span><span class="fl">${esc(o)}</span><b>${p&&i==q.a?'✓ Correta':p&&i==s.pick?'✗ Errou':''}</b></button>`).join('')}${p?`<div class="card" role="status" style="font-weight:700">${s.pick==q.a?'Correto!':'Errado. A resposta certa é a '+'ABCD'[q.a]+'.'}</div><button class="btn big" data-a="sn">${s.i+1>=n?'Ver nota':'Próxima questão'}</button>`:''}</div><button class="btn2" style="margin-top:20px" data-a="endsm">Encerrar simulado</button>`};
V.prog=()=>{const all=S.decks.flatMap(d=>d.cards.map(c=>({...c,dn:d.name}))),sims=S.hist.filter(h=>h.k=='s'),hard=all.filter(c=>c.err>0).sort((a,b)=>b.err-a.err).slice(0,5);
return `<h1>Progresso</h1><div class="stats" style="margin:16px 0"><div class="card"><b>${all.filter(c=>c.lvl>=3).length}/${all.length}</b><span class="sub">cartas dominadas</span></div><div class="card"><b>${streak()}</b><span class="sub">dias seguidos</span></div><div class="card"><b>${sims.length?pt(sims.reduce((a,h)=>a+h.sc,0)/sims.length):'—'}</b><span class="sub">nota média</span></div><div class="card"><b style="color:var(--err)">${all.filter(c=>c.err>0).length}</b><span class="sub">cartas difíceis</span></div></div><h2>Histórico</h2><div class="col">${S.hist.slice(-12).reverse().map(h=>`<div class="card row"><div class="fl"><b>${esc(h.deck)}</b><div class="sub" style="font-size:13px">${h.k=='s'?'Simulado':'Estudo'} · ${fmt(h.d)}</div></div><b style="font-size:22px;color:var(--ok)">${h.k=='s'?pt(h.sc):h.sc+'/'+h.tot}</b></div>`).join('')||'<p class="sub">Estude ou faça um simulado para ver seu histórico.</p>'}</div><h2>Mais difíceis para você</h2><div class="card">${hard.map(c=>`<div style="padding:6px 0">${esc(c.q)} <small class="sub">· ${esc(c.dn)} · ${c.err} erro(s)</small></div>`).join('')||'<span class="sub">Nenhuma carta errada ainda.</span>'}</div>`};
V.set=()=>`<h1 style="margin-bottom:16px">Configurações</h1><div class="col"><div class="card"><b>Tema</b>${seg('theme',S.theme,[['light','Claro'],['dark','Escuro']])}</div><div class="card"><b>Tempo para responder cada carta</b><p class="sub" style="margin:4px 0 0;font-size:14px">Ao acabar o tempo, a resposta aparece e a carta conta como erro. Desligado: responda quando quiser.</p>${seg('timer',S.timer,[[0,'Desligado'],[5,'5 s'],[10,'10 s'],[15,'15 s'],[20,'20 s']])}</div><div class="card"><b>Cartas por sessão de estudo</b>${seg('sess',S.sess,[[10,'10'],[20,'20'],[30,'30']])}</div><div class="card row"><div class="fl"><b>Cartas difíceis primeiro</b><div class="sub" style="font-size:14px">Cartas com mais erros aparecem com mais frequência.</div></div><button class="sw" role="switch" aria-label="Cartas difíceis primeiro" aria-checked="${S.hard}" data-a="tog"><i></i></button></div><button class="btn2" data-a="reset" style="border-color:var(--err);color:var(--err)">${T.cf=='r'?'Toque de novo para apagar tudo':'Apagar todos os dados'}</button></div>`;
let tm,iv;const clr=()=>{clearTimeout(tm);clearInterval(iv)};
function render(){clr();document.documentElement.dataset.theme=S.theme;const nb=(v,l,d,x='')=>`<button class="nb ${x}" data-a="nav" data-v="${v}" aria-label="${l}" ${T.view==v?'aria-current="page"':''}><span class="pl">${ic(d)}</span><span class="nl">${l}</span></button>`,th=S.theme=='dark'?'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 2v2 M12 20v2 M2 12h2 M20 12h2 M5 5l1.5 1.5 M17.5 17.5L19 19 M5 19l1.5-1.5 M17.5 6.5L19 5':'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z';
$('#nv').innerHTML='<div class="lg">M</div>'+NAV.map(([v,l,d])=>nb(v,l,d)).join('')+'<div class="sp"></div>'+nb('set','Configurações',GEAR,'dsk')+`<button class="nb dsk" data-a="th" aria-label="Alternar tema"><span class="pl">${ic(th)}</span><span class="nl">${S.theme=='dark'?'Tema claro':'Tema escuro'}</span></button>`;
$('#m').innerHTML=`<div class="mh"><div style="width:32px;height:32px;border-radius:9px;background:#3B2FD9;color:#fff;font-weight:800;display:grid;place-items:center">M</div><b class="fl" style="font-size:18px">MemoQuiz</b><button class="ib" data-a="nav" data-v="set" aria-label="Configurações" ${T.view=='set'?'style="background:var(--soft);color:var(--ink)"':''}>${ic(GEAR)}</button><button class="ib" data-a="th" aria-label="Alternar tema">${ic(th)}</button></div>`+V[T.view]();
const s=T.st;if(T.view=='study'&&s&&!s.done&&!s.rev&&!s.res&&S.timer&&$('#tbi')){let left=S.timer;setTimeout(()=>{const i=$('#tbi');if(i){i.style.transitionDuration=S.timer+'s';i.style.width='0'}},40);iv=setInterval(()=>{left--;const l=$('#tl');if(l)l.textContent=Math.max(left,0)+' s'},1000);tm=setTimeout(()=>A.timeup(),S.timer*1000)}}
const rec=(c,ok)=>{const s=T.st;if(ok){c.ok++;c.lvl=Math.min(5,c.lvl+1)}else{c.err++;c.lvl=0;if(s){s.errs++;if(!s.rep[c.id]){s.rep[c.id]=1;s.q.push(c.id)}}}markDay();save()};
const adv=()=>{const s=T.st;s.i++;s.rev=false;s.res=null;if(s.i>=s.q.length){s.done=true;S.hist.push({d:today(),k:'e',deck:deck(s.d).name,sc:s.q.length-s.errs,tot:s.q.length});save()}render();window.scrollTo(0,0)};
const start=id=>{const d=deck(id);if(!d||!d.cards.length){toast('Esse baralho não tem cartas');return}T.st={d:id,q:d.cards.map(c=>[c,(S.hard?c.err*2-c.lvl:0)+Math.random()*2]).sort((a,b)=>b[1]-a[1]).slice(0,S.sess).map(x=>x[0].id),i:0,errs:0,rep:{},rev:false,res:null,done:false};S.last=id;save();T.view='study';render();window.scrollTo(0,0)};
const A={nav(d){T.view=d.v;if(d.v=='home')T.deck=null;render();window.scrollTo(0,0)},th(){S.theme=S.theme=='dark'?'light':'dark';save();render()},
set(d){S[d.k]=d.k=='theme'?d.v:+d.v;save();render()},tog(){S.hard=!S.hard;save();render()},reset(){cf('r',()=>{S=seed();T.st=T.sm=T.deck=T.f=null;save()})},
newdeck(){const d={id:uid(),name:'Novo baralho',subj:'',cards:[]};S.decks.push(d);save();T.deck=d.id;T.f=blank();T.view='home';render();window.scrollTo(0,0)},
edit(d){T.deck=d.id;T.f=blank();T.view='home';render();window.scrollTo(0,0)},
ddeck(){cf('d',()=>{S.decks=S.decks.filter(x=>x.id!=T.deck);if(S.last==T.deck)S.last=null;T.deck=null;T.f=null;save()})},
ft(d){T.f.t=d.v;render()},ftr(d){T.f.truth=d.v=='1';render()},fcancel(){T.f=blank();render()},
fsave(){const f=T.f,d=deck(T.deck),q=f.q.trim();if(!q)return toast('Escreva a pergunta ou afirmação');if(f.t=='i'&&!f.a.trim())return toast('Escreva a resposta');const o={t:f.t,q,a:f.a.trim(),truth:f.truth,why:f.why.trim()};if(f.id)Object.assign(d.cards.find(x=>x.id==f.id),o);else d.cards.push({id:uid(),...o,err:0,ok:0,lvl:0});T.f=blank();save();render();toast('Carta salva')},
ecard(d){const c=deck(T.deck).cards.find(x=>x.id==d.id);T.f={id:c.id,t:c.t,q:c.q,a:c.a||'',truth:!!c.truth,why:c.why||''};render();$('#fm').scrollIntoView({behavior:'smooth'})},
dcard(d){cf('c'+d.id,()=>{const k=deck(T.deck);k.cards=k.cards.filter(x=>x.id!=d.id);save()})},
study(d){start(d.id)},endst(){T.st=null;render()},rev(){T.st.rev=true;render()},
ans(d){if(!T.st.rev)return;rec(cardOf(T.st),d.ok=='1');adv()},vf(d){const s=T.st,c=cardOf(s),ok=(d.v=='1')===!!c.truth;rec(c,ok);s.res=ok?'ok':'bad';s.rev=true;render()},nx(){adv()},
timeup(){const s=T.st;if(!s||s.res||s.rev)return;rec(cardOf(s),false);s.res='time';s.rev=true;render()},
gosim(d){T.view='sim';A.startsim(d)},
startsim(d){const k=deck(d.id),pool=[...new Set(S.decks.flatMap(x=>x.cards).filter(c=>c.t=='i').map(c=>c.a))],qs=[];shuf(k.cards).slice(0,20).forEach(c=>{if(c.t=='v')qs.push({c,q:'Verdadeiro ou falso: '+c.q,o:['Verdadeiro','Falso'],a:c.truth?0:1});else{const o=shuf(pool.filter(x=>x!==c.a)).slice(0,3);if(o.length){const l=shuf([c.a,...o]);qs.push({c,q:c.q,o:l,a:l.indexOf(c.a)})}}});if(!qs.length)return toast('Adicione mais cartas para gerar o simulado');T.sm={id:k.id,name:k.name,qs,i:0,pick:null,sc:0,wr:[],done:false};T.view='sim';render();window.scrollTo(0,0)},
sp(d){const s=T.sm;if(s.pick!=null)return;const q=s.qs[s.i],i=+d.i;s.pick=i;if(i==q.a){s.sc++;q.c.ok++;q.c.lvl=Math.min(5,q.c.lvl+1)}else{s.wr.push(q);q.c.err++;q.c.lvl=0}markDay();save();render()},
sn(){const s=T.sm;s.i++;s.pick=null;if(s.i>=s.qs.length){s.done=true;s.nota=Math.round(s.sc/s.qs.length*100)/10;S.hist.push({d:today(),k:'s',deck:s.name,sc:s.nota,tot:s.qs.length});save()}render();window.scrollTo(0,0)},endsm(){T.sm=null;render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&T.f)T.f[t.dataset.f]=t.value;if(t.dataset.d){const d=deck(T.deck);if(d){d[t.dataset.d]=t.value;save()}}});
render();
</script></body></html>
